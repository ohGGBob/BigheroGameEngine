name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  VULKAN_SDK_VERSION: "1.4.304.0"

jobs:
  windows-build:
    name: Windows ${{ matrix.config }} (VS2022 + Vulkan SDK)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: win-x64-debug
            config: Debug
            builddir: x64-Debug
          - preset: win-x64-release
            config: Release
            builddir: x64-Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Vulkan SDK installer
        id: cache-vulkan-sdk
        uses: actions/cache@v4
        with:
          path: vulkan-sdk.exe
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Download Vulkan SDK installer
        if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/vulkan-sdk.exe"
          # sdk.lunarg.com 偶发极慢：显式超时+重试，避免 IWR 无超时卡死 6h（历史 run 57/61 均卡死于下载）
          curl.exe -L --retry 5 --retry-delay 5 --connect-timeout 60 --max-time 1800 -o vulkan-sdk.exe $url
          if (-not (Test-Path vulkan-sdk.exe) -or (Get-Item vulkan-sdk.exe).Length -lt 1024) {
            throw "Vulkan SDK download failed"
          }

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -Wait -FilePath ".\vulkan-sdk.exe" -ArgumentList "/S"
          Remove-Item vulkan-sdk.exe -ErrorAction SilentlyContinue
          # 供 find_program(glslc) 的 `ENV VULKAN_SDK` hint 使用（SDK 默认安装目录 C:\VulkanSDK\<version>）
          "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: CMake Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Engine & Executable
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Build Unit Tests
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroTests

      - name: Build Core Header Self-Containment Check (Debug only)
        if: matrix.config == 'Debug'
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroHeaderCheck

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir out/build/${{ matrix.builddir }} -C ${{ matrix.config }} --output-on-failure

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}
          path: |
            out/build/${{ matrix.builddir }}/bin/**/*.exe
            out/build/${{ matrix.builddir }}/bin/**/*.dll
            out/build/${{ matrix.builddir }}/bin/shaders/
            out/build/${{ matrix.builddir }}/bin/assets/
          if-no-files-found: warn
          retention-days: 7

      - name: clang-tidy Static Analysis (Debug only)
        if: matrix.config == 'Debug'
        shell: cmd
        run: |
          where ninja >nul 2>&1 || choco install ninja -y --no-progress
          where clang-tidy >nul 2>&1 || choco install llvm -y --no-progress
          if not exist "C:\Program Files\LLVM\bin\clang-tidy.exe" goto :skip_tidy
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          cmake -S . -B out/build/clang-tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug || exit /b 1
          for /f "delims=" %%f in ('dir /b /s src\*.cpp ^| findstr /v tests') do clang-tidy -p out/build/clang-tidy "%%f" || exit /b 1
          exit /b 0
          :skip_tidy
          echo "clang-tidy not available, skipping static analysis"

  linux-build:
    name: Linux ${{ matrix.config }} (Clang + Vulkan SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: linux-x64-debug
          - config: Release
            preset: linux-x64-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            libvulkan-dev \
            vulkan-validationlayers \
            vulkan-tools \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            glslc \
            clang-tidy \
            cmake \
            mesa-vulkan-drivers \
            libgl1 \
            xvfb

      - name: Setup lavapipe (software Vulkan for headless)
        run: |
          sudo apt-get install -y mesa-vulkan-drivers
          # 动态探测 lavapipe ICD json（mesa 版本间文件名可能不同：lvp_icd.x86_64.json / lvp_icd.json）
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' | head -n1)"
          if [ -z "$ICD" ]; then
            echo "::error::lavapipe ICD json not found under /usr/share/vulkan/icd.d"
            ls -la /usr/share/vulkan/icd.d
            exit 1
          fi
          echo "lavapipe ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          if ! vulkaninfo --summary; then
            echo "::error::vulkaninfo failed; lavapipe 不可用"
            exit 1
          fi

      - name: CMake Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Engine & Executable
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Build Unit Tests
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroTests

      - name: Build Core Header Self-Containment Check (Debug only)
        if: matrix.config == 'Debug'
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroHeaderCheck

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.config }}
          path: out/build/${{ matrix.preset }}/bin/
          if-no-files-found: warn
          retention-days: 7

      - name: Shader File Existence Quick Check (--headless --validate-only, no rendering)
        if: matrix.config == 'Debug'
        run: |
          # VK_ICD_FILENAMES / VK_DRIVER_FILES 已由 Setup lavapipe 步骤写入 GITHUB_ENV
          BIN="$(find out/build/${{ matrix.preset }} -type f -name BigHeroGameEngine | head -n1)"
          echo "Located engine binary: $BIN"
          cd "$(dirname "$BIN")"
          xvfb-run -a --server-args="-screen 0 1024x768x24" ./BigHeroGameEngine --headless --validate-only

      - name: Real Render Screenshot Validation (lavapipe + xvfb, --no-ui, default/slice x pp on/off)
        if: matrix.config == 'Debug'
        run: |
          # VK_ICD_FILENAMES / VK_DRIVER_FILES 已由 Setup lavapipe 步骤写入 GITHUB_ENV
          BIN="$(find out/build/${{ matrix.preset }} -type f -name BigHeroGameEngine | head -n1)"
          echo "Located engine binary: $BIN"
          cd "$(dirname "$BIN")"
          mkdir -p out
          # --no-ui：纯场景截图（编辑器覆盖层不入画面），基线不受 UI 迭代影响。
          # 4 张 = default/slice 场景 x 后处理开/关，与 tests/baselines/README.md 一一对应。
          xvfb-run -a --server-args="-screen 0 1024x768x24" ./BigHeroGameEngine --no-ui --post-process --screenshot out/ci_default_pp.png
          xvfb-run -a --server-args="-screen 0 1024x768x24" ./BigHeroGameEngine --no-ui --screenshot out/ci_default_nopp.png
          xvfb-run -a --server-args="-screen 0 1024x768x24" ./BigHeroGameEngine --no-ui --scene slice --post-process --screenshot out/ci_slice_pp.png
          xvfb-run -a --server-args="-screen 0 1024x768x24" ./BigHeroGameEngine --no-ui --scene slice --screenshot out/ci_slice_nopp.png

      - name: Imaging Baseline Regression (lavapipe, bootstrap compare-or-skip)
        if: matrix.config == 'Debug'
        env:
          # 临时容差（自举期占位值）：tolerance=单像素亮度差（0-255），max-ratio=差异像素占比上限。
          # lavapipe 软件渲染慢且 dt 无 clamp -> 自转相位 run-to-run 噪声远大于 GPU，
          # 正式值须在采纳基线时按 tests/baselines/README.md 用两份 CI artifact 实测重校准。
          IMG_TOLERANCE: "32"
          IMG_MAX_RATIO: "0.25"
        run: |
          cmp_fail=0; compared=0; skipped=0
          for cur in $(find out/build -type f -name 'ci_*.png' -path '*/out/*'); do
            name="$(basename "$cur")"
            base="tests/baselines/lavapipe/${name#ci_}"
            if [ -f "$base" ]; then
              echo "Comparing $base vs $cur"
              python3 tools/compare_images.py "$base" "$cur" --tolerance "$IMG_TOLERANCE" --max-ratio "$IMG_MAX_RATIO" || cmp_fail=1
              compared=$((compared+1))
            else
              echo "SKIP (baseline not adopted yet): $base"
              skipped=$((skipped+1))
            fi
          done
          echo "baseline compare summary: compared=$compared skipped=$skipped"
          if [ "$cmp_fail" -ne 0 ]; then
            echo "::error::成像回归超差：lavapipe 渲染与 tests/baselines/lavapipe/ 基线不一致。若是有意的场景/渲染改动，请按 tests/baselines/README.md 重新生成基线。"
            exit 1
          fi
          if [ "$skipped" -gt 0 ] && [ "$compared" -eq 0 ]; then
            echo "NOTE: tests/baselines/lavapipe/ 尚无基线，本次截图已作为 baseline-candidates artifact 上传。"
            echo "请按 tests/baselines/README.md 的『一次性行政动作』审核并提交基线，成像防线自此生效。"
          fi

      - name: Upload CI Screenshots (baseline-candidates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-candidates
          path: |
            out/build/**/out/ci_default_pp.png
            out/build/**/out/ci_default_nopp.png
            out/build/**/out/ci_slice_pp.png
            out/build/**/out/ci_slice_nopp.png
          if-no-files-found: warn
          retention-days: 7

      - name: clang-tidy Static Analysis
        if: matrix.config == 'Debug'
        run: |
          cmake -S . -B out/build/clang-tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
          find src -name '*.cpp' -not -path '*/tests/*' | xargs clang-tidy -p out/build/clang-tidy

  linux-sanitizers:
    name: Linux Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            libvulkan-dev \
            vulkan-validationlayers \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            glslc \
            cmake \
            libasan8 \
            libubsan1 \
            mesa-vulkan-drivers

      - name: CMake Configure (with Sanitizers)
        run: cmake --preset sanitizers-debug

      - name: Build Engine & Tests
        run: cmake --build --preset sanitizers-debug

      - name: Run Unit Tests with Sanitizers
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir out/build/linux-x64-debug --output-on-failure

  android-build:
    name: Android arm64 (NDK, compile check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc

      - name: Resolve Android NDK path
        run: |
          # runner 镜像的系统环境变量不在 Actions `env` 上下文内（值为空），必须经 shell 写入 GITHUB_ENV
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            echo "::error::ANDROID_NDK_LATEST_HOME / ANDROID_NDK_HOME 均未定义"
            exit 1
          fi
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: CMake Configure (NDK arm64-v8a)
        run: cmake --preset android-arm64-debug

      - name: Build libmain.so (engine + NativeActivity)
        run: cmake --build --preset android-arm64-debug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: |
            platform/android/app/src/main/jniLibs/arm64-v8a/libmain.so
            platform/android/app/src/main/assets/shaders/
          if-no-files-found: warn
          retention-days: 7

  macos-build:
    name: macOS ${{ matrix.config }} (Clang + Vulkan Loader)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: macos-arm64-debug
          - config: Release
            preset: macos-arm64-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install \
            ninja \
            cmake \
            glfw \
            shaderc \
            vulkan-headers \
            vulkan-loader \
            vulkan-validationlayers

      - name: CMake Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Engine & Executable
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Build Unit Tests
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroTests

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.config }}
          path: |
            out/build/${{ matrix.preset }}/bin/
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Code Style (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format (pinned to match local dev toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user --break-system-packages clang-format==19.1.7
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Code Format
        run: |
          files=$(find src -name '*.h' -o -name '*.cpp')
          clang-format --dry-run --Werror $files

  package:
    name: Create Release Package
    needs: [windows-build, linux-build, macos-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: artifacts/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true