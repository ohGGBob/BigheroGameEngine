name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  windows-build:
    name: Windows ${{ matrix.config }} (VS2022 + Vulkan SDK)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: win-x64-debug
            config: Debug
            builddir: x64-Debug
          - preset: win-x64-release
            config: Release
            builddir: x64-Release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 MSVC 构建环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath ".\vulkan-sdk.exe" -ArgumentList "/S"
          Remove-Item vulkan-sdk.exe

      - name: CMake 配置
        run: cmake --preset ${{ matrix.preset }}

      - name: 编译引擎与可执行程序
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: 编译单元测试
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --target BigHeroTests

      - name: 运行单元测试 (CTest)
        run: ctest --test-dir out/build/${{ matrix.builddir }} -C ${{ matrix.config }} --output-on-failure

      - name: clang-tidy 静态分析（仅 Debug）
        if: matrix.config == 'Debug'
        shell: cmd
        run: |
          cmake -S . -B out/build/clang-tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
          for /f "delims=" %%f in ('dir /b /s src\*.cpp ^| findstr /v tests') do clang-tidy -p out/build/clang-tidy "%%f"

  lint:
    name: Code Style (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: 校验代码格式
        run: |
          files=$(find src -name '*.h' -o -name '*.cpp')
          clang-format --dry-run --Werror $files
